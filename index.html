    <style>

            font-family: 'Montserrat', sans-serif;

        }
        .yasher-card { 
            background: rgba(30, 41, 59, 0.7);

            border: 1px solid rgba(34, 197, 94, 0.15);

        }
        .yasher-btn { 
            background: linear-gradient(135deg, #16a34a, #22c55e); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        }
        .yasher-btn:hover { 
            background: linear-gradient(135deg, #15803d, #16a34a); 
            transform: translateY(-2px) scale(1.02); 
            box-shadow: 0 10px 25px -3px rgba(34, 197, 94, 0.5);

        .btn-res { 
            transition: all 0.2s; 
            padding: 8px 4px; 
            border-radius: 8px; 
            font-weight: 900;

            color: white;
            text-transform: uppercase;

        @media (min-width: 640px) {
            .btn-res { padding: 10px 16px; font-size: 11px; border-radius: 10px; letter-spacing: 0.05em; }
        }
        .btn-res:hover { transform: scale(1.05); filter: brightness(1.2); }
        .btn-res:active { transform: scale(0.95); }

        #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 100; backdrop-filter: blur(8px); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        input, select {
            background: rgba(15, 23, 42, 0.6) !important;
            color: #f8fafc !important;

        }
        input:focus, select:focus {
            border-color: #22c55e !important;
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2) !important;
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes pulseGlow {
            0%, 100% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5), inset 0 0 10px rgba(239, 68, 68, 0.2); }
            50% { border-color: rgba(234, 179, 8, 1); box-shadow: 0 0 25px rgba(234, 179, 8, 0.8), inset 0 0 15px rgba(234, 179, 8, 0.4); }
        }
        .ad-pulsing { animation: pulseGlow 1.2s infinite ease-in-out; }

        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 10px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Form Side -->
            <div class="lg:col-span-4">

                            <button onclick="setTab('history')" id="tab-history" class="text-xs sm:text-sm font-black uppercase tracking-widest text-slate-500 hover:text-slate-300 pb-1 transition-all border-b-2 border-transparent shrink-0">История</button>
                            <button onclick="setTab('stats')" id="tab-stats" class="text-xs sm:text-sm font-black uppercase tracking-widest text-slate-500 hover:text-slate-300 pb-1 transition-all border-b-2 border-transparent shrink-0">Статистика</button>

    <script>
        setTimeout(() => {
            const closeBtn = document.getElementById('close-ad-btn');
            if (closeBtn) closeBtn.classList.remove('hidden');
        }, 20000);

        function closeStickyAd() {
            document.getElementById('sticky-ad-container').style.display = 'none';
        }

        // Подключение к локальному серверу PocketBase
        const pb = new PocketBase('http://127.0.0.1:8090');

        let allBets = [];
        let currentTab = 'active';
        let currentUser = 'Йорг1';
        let profitChartInstance = null;
        const INITIAL_BANK = 5000;

        function setTab(tab) {
            currentTab = tab;
            const activeClass = "text-xs sm:text-sm font-black uppercase tracking-widest text-green-500 border-b-2 border-green-500 pb-1 transition-all shrink-0";
            const inactiveClass = "text-xs sm:text-sm font-black uppercase tracking-widest text-slate-500 hover:text-slate-300 pb-1 transition-all border-b-2 border-transparent shrink-0";
            
            document.getElementById('tab-active').className = tab === 'active' ? activeClass : inactiveClass;
            document.getElementById('tab-history').className = tab === 'history' ? activeClass : inactiveClass;
            document.getElementById('tab-stats').className = tab === 'stats' ? activeClass : inactiveClass;
            
            if (tab === 'stats') {
                document.getElementById('betsContainer').classList.add('hidden');
                document.getElementById('statsContainer').classList.remove('hidden');
                renderChart();
            } else {
                document.getElementById('betsContainer').classList.remove('hidden');
                document.getElementById('statsContainer').classList.add('hidden');
                renderBets();
            }
        }

        async function refreshData(showLoader = true) {
            if (showLoader) document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                currentUser = document.getElementById('userSelect').value;
                
                // Фильтрация записей из PocketBase по выбранному пользователю
                const records = await pb.collection('Stavki').getFullList({
                    filter: `user = "${currentUser}"`,
                    sort: '-created',
                });

                allBets = records.map(r => ({
                    id: r.id,
                    match: r.sobytie,
                    event: r.tip_stavki,
                    odds: r.koeff,
                    amount: r.stavka,
                    result: r.result || 'В процессе',
                    profit: r.profit || 0,
                    created: r.created
                }));

                calculateBalanceAndROI();
                if (currentTab === 'stats') renderChart();
                else renderBets();

            } catch (e) {
                console.error("Ошибка загрузки из PocketBase:", e);
            } finally {
                if (showLoader) document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function calculateBalanceAndROI() {
            let totalSpent = 0;
            let totalReturned = 0;

            allBets.forEach(b => {
                if (b.result !== 'В процессе') {
                    totalSpent += b.amount;
                    if (b.result === 'Выигрыш') {
                        totalReturned += (b.amount * b.odds);
                    } else if (b.result === 'Возврат') {
                        totalReturned += b.amount;
                    }
                }
            });

            const currentBalance = INITIAL_BANK - totalSpent + totalReturned;
            const netProfit = totalReturned - totalSpent;
            const roi = totalSpent > 0 ? ((netProfit / totalSpent) * 100).toFixed(1) : 0;

            document.getElementById('currentBalance').innerText = Math.round(currentBalance).toLocaleString('ru-RU') + ' ₽';
            document.getElementById('currentROI').innerText = roi + '%';
        }

        function changeUser() {
            refreshData(true);
        }

        async function updateStatus(id, newStatus) {
            const bet = allBets.find(b => b.id === id);
            if (!bet) return;

            let calculatedProfit = 0;
            if (newStatus === 'Выигрыш') {
                calculatedProfit = (bet.amount * bet.odds) - bet.amount;
            } else if (newStatus === 'Проигрыш') {
                calculatedProfit = -bet.amount;
            } else if (newStatus === 'Возврат') {
                calculatedProfit = 0;
            }

            bet.result = newStatus;
            bet.profit = calculatedProfit;

            calculateBalanceAndROI();
            renderBets();

            try {
                await pb.collection('Stavki').update(id, {
                    result: newStatus,
                    profit: calculatedProfit
                });
            } catch (err) {
                console.error("Ошибка обновления статуса:", err);
            }
        }

        async function deleteBet(id) {
            if (!confirm('Удалить эту ставку?')) return;
            
            allBets = allBets.filter(b => b.id !== id);
            calculateBalanceAndROI();
            renderBets();

            try {
                await pb.collection('Stavki').delete(id);
            } catch (err) {
                console.error("Ошибка удаления:", err);
            }
        }

        document.getElementById('betForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const match = document.getElementById('match').value;
            const event = document.getElementById('event').value;
            const odds = parseFloat(document.getElementById('odds').value.replace(',', '.'));
            const amount = parseFloat(document.getElementById('amount').value);

            const newRecordData = {
                user: currentUser,
                sobytie: match,
                tip_stavki: event,
                koeff: odds,
                stavka: amount,
                result: 'В процессе',
                profit: 0
            };

            document.getElementById('match').value = '';
            document.getElementById('event').value = '';
            document.getElementById('odds').value = '';

            try {
                const record = await pb.collection('Stavki').create(newRecordData);
                allBets.unshift({
                    id: record.id,
                    match: record.sobytie,
                    event: record.tip_stavki,
                    odds: record.koeff,
                    amount: record.stavka,
                    result: record.result,
                    profit: record.profit,
                    created: record.created
                });

                calculateBalanceAndROI();
                renderBets();
            } catch (err) {
                console.error("Ошибка создания ставки:", err);
                alert("Не удалось сохранить ставку в PocketBase");
            }
        };

        function renderBets() {
            const container = document.getElementById('betsContainer');
            const filtered = allBets.filter(item => {
                if (currentTab === 'active') return item.result === 'В процессе';
                return item.result !== 'В процессе';
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-300 font-bold uppercase text-[10px] tracking-widest">${currentTab === 'active' ? 'Нет активных ставок' : 'История пуста'}</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isHistory = currentTab === 'history';
                let resultBadge = '';
                let profitText = '';
                
                if (isHistory) {
                    if (item.result === 'Выигрыш') {
                        resultBadge = `<span class="bg-green-500/20 border border-green-500/30 text-green-400 px-3 py-1 rounded-lg text-[10px] font-black uppercase">ВЫИГРЫШ</span>`;
                        profitText = `<span class="text-green-400 font-black">+${item.profit.toFixed(0)} ₽</span>`;
                    } else if (item.result === 'Проигрыш') {
                        resultBadge = `<span class="bg-red-500/20 border border-red-500/30 text-red-400 px-3 py-1 rounded-lg text-[10px] font-black uppercase">ПРОИГРЫШ</span>`;
                        profitText = `<span class="text-red-400 font-black">${item.profit.toFixed(0)} ₽</span>`;
                    } else {
                        resultBadge = `<span class="bg-slate-700/50 border border-slate-600/50 text-slate-400 px-3 py-1 rounded-lg text-[10px] font-black uppercase">ВОЗВРАТ</span>`;
                        profitText = `<span class="text-slate-400 font-black">0 ₽</span>`;
                    }
                }

                const dateFormatted = new Date(item.created).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

                return `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 sm:p-5 border ${isHistory ? 'border-slate-700/50 bg-slate-800/30' : 'border-green-500/30 bg-green-900/10'} rounded-2xl fade-in gap-3 sm:gap-4">
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="w-1.5 h-10 sm:h-12 ${isHistory ? (item.result === 'Выигрыш' ? 'bg-green-500' : item.result === 'Проигрыш' ? 'bg-red-500' : 'bg-slate-500') : 'bg-green-400'} rounded-full shrink-0"></div>
                        <div class="min-w-0">
                            <p class="font-black text-slate-200 text-sm tracking-tight break-words">${item.match}</p>
                            <p class="text-[11px] font-bold text-slate-400 mt-0.5">${item.event}</p>
                            <p class="text-[10px] font-bold text-slate-500 uppercase mt-1">${dateFormatted} • КФ <span class="text-green-400">${item.odds}</span></p>
                        </div>
                    </div>
                    <div class="flex flex-col items-start sm:items-end gap-3 w-full sm:w-auto">
                        ${!isHistory ? `
                        <div class="flex flex-col items-end gap-2 w-full">
                            <div class="grid grid-cols-3 gap-1 sm:flex sm:gap-2 w-full sm:w-auto">
                                <button onclick="updateStatus('${item.id}', 'Выигрыш')" class="btn-res bg-green-500">ВЫИГРЫШ</button>
                                <button onclick="updateStatus('${item.id}', 'Проигрыш')" class="btn-res bg-red-500">ПРОИГРЫШ</button>
                                <button onclick="updateStatus('${item.id}', 'Возврат')" class="btn-res bg-slate-400">ВОЗВРАТ</button>
                            </div>
                            <button onclick="deleteBet('${item.id}')" class="text-[9px] font-bold text-slate-500 hover:text-red-500 uppercase">Удалить</button>
                        </div>
                        ` : `
                        <div class="flex flex-col items-end gap-1">
                            <div class="flex items-center gap-2">
                                <button onclick="deleteBet('${item.id}')" class="p-1.5 text-slate-500 hover:text-red-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                                ${resultBadge}
                            </div>
                            <div class="mt-1 text-sm">${profitText}</div>
                        </div>
                        `}
                        <p class="text-[10px] font-black text-slate-500 uppercase">Сумма: <span class="text-slate-300">${item.amount} ₽</span></p>
                    </div>
                </div>`;
            }).join('');
        }

        function renderChart() {
            const ctx = document.getElementById('profitChart').getContext('2d');
            const finished = [...allBets].filter(b => b.result !== 'В процессе').reverse();
            
            let cumulative = 0;
            const labels = ['Старт'];
            const data = [0];

            finished.forEach(b => {
                cumulative += b.profit;
                labels.push(new Date(b.created).toLocaleDateString('ru-RU'));
                data.push(cumulative);
            });

            if (profitChartInstance) profitChartInstance.destroy();

            profitChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Динамика банка (₽)',
                        data: data,
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'Montserrat', weight: 'bold' } } } },
                    scales: {
                        x: { grid: { color: 'rgba(51, 65, 85, 0.3)' }, ticks: { color: '#64748b' } },
                        y: { grid: { color: 'rgba(51, 65, 85, 0.3)' }, ticks: { color: '#64748b' } }
                    }
                }
            });
        }

        window.onload = () => refreshData(true);
    </script>
</body>
</html>
